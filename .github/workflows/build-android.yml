name: Compilar app Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ubuntu-latest ya trae el SDK de Android (ANDROID_HOME);
      # Gradle descarga solo la plataforma que falte.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar keystore de firma
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/noc.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/noc.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin ANDROID_KEYSTORE_B64: el APK se firma con una clave de depuración"
          fi

      - name: Compilar APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p mobile/android assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk dist/noc-grupo-bistro.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: noc-grupo-bistro-apk
          path: dist/noc-grupo-bistro.apk

      - name: Publicar en la Release android-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: App Android v1.0.${{ github.run_number }}
          prerelease: false
          files: dist/noc-grupo-bistro.apk
