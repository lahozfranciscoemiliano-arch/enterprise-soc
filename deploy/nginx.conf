# Reverse proxy para Enterprise SOC.
# Copiar a /etc/nginx/sites-available/enterprise-soc, reemplazar
# noc.tudominio.com por el dominio real, activar con:
#   ln -s /etc/nginx/sites-available/enterprise-soc /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Despues correr: certbot --nginx -d noc.tudominio.com
# (certbot reescribe este archivo agregando el bloque de TLS automaticamente).

server {
    listen 80;
    server_name noc.tudominio.com;

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API del backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket del backend (requiere headers de Upgrade explicitos)
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
