# Reverse proxy para Enterprise SOC. NO se edita a mano: deploy/setup-domain.sh
# lo copia a /etc/nginx/sites-available/enterprise-soc reemplazando
# __DOMAIN__ por el dominio real (ej. bistro.enterprisesoc.lat) y despues
# certbot le agrega el HTTPS (bloque 443 + redireccion de http a https).
#
# Dos bloques:
#   1. El dominio: el panel, la API, la descarga del agente y el WebSocket.
#   2. Acceso por IP (default_server): los agentes y el poller de Fortinet que
#      todavia usan http://IP siguen funcionando hasta que se pasen al dominio
#      (Admin -> Servidores -> "Direccion del NOC en los agentes"). Un navegador
#      que entra por la IP se redirige al dominio con HTTPS.

server {
    listen 80;
    server_name __DOMAIN__;

    # Fotos de servidores, reportes de inventario: el backend acepta hasta 5 MB.
    client_max_body_size 8m;

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API del backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Descarga del .exe del agente (install-agent.ps1 y la auto-actualizacion
    # de los agentes la piden a GET /downloads/enterprise-soc-agent.exe). Sin
    # este bloque esa ruta cae en "location /" (el frontend) y devuelve 404.
    location /downloads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket del backend (requiere headers de Upgrade explicitos)
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 8m;

    # Navegadores: al dominio con HTTPS (el panel no funciona por IP, las
    # cookies de sesion son del dominio).
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }

    # Agentes, poller de Fortinet y monitor del VPS (127.0.0.1) por IP.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /downloads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
