# Stack central completo (Postgres + backend + frontend) para produccion.
# Variables leidas desde un .env en esta misma carpeta (ver .env.example).
# Nginx corre FUERA de Docker, en el host, y reenvia a estos servicios via
# localhost (ver deploy/nginx.conf) — por eso los puertos se publican solo
# en 127.0.0.1, nunca en 0.0.0.0.
# Recursos: deploy/tune-vps.sh genera docker-compose.override.yml (no
# versionado) con Postgres/Node dimensionados segun los nucleos y la RAM de
# la VPS; docker compose lo combina solo con este archivo.

# Logs de Docker con tope: sin esto el json-file de cada contenedor crece
# sin limite y en unos meses llena el disco de la VPS.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-soc-postgres
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nocsoc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-nocsoc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports:": solo accesible desde otros contenedores de esta red,
    # nunca desde el host ni desde internet.

  backend:
    build:
      context: ./backend
    container_name: enterprise-soc-backend
    restart: unless-stopped
    logging: *logging
    init: true
    stop_grace_period: 20s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Si el backend deja de responder (event loop colgado), Docker lo marca
    # unhealthy y soc-autoheal.timer lo reinicia (ver deploy/tune-vps.sh).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nocsoc}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 3000
      NODE_ENV: production
      AGENT_ENROLLMENT_SECRET: ${AGENT_ENROLLMENT_SECRET}
      NOTIFY_MIN_SEVERITY: ${NOTIFY_MIN_SEVERITY:-HIGH}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      # Zona horaria de las fechas en textos de alertas/notificaciones (ej. America/Asuncion).
      APP_TIMEZONE: ${APP_TIMEZONE:-}
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}
      FORTI_SYSLOG_ENABLED: ${FORTI_SYSLOG_ENABLED:-false}
      FORTI_SYSLOG_PORT: ${FORTI_SYSLOG_PORT:-5514}
    volumes:
      # El .exe del agente publicado sobrevive a un "docker compose up --build"
      - agent_downloads:/app/downloads
      # Reportes ejecutivos generados (PDF); mismo motivo que agent_downloads.
      - report_files:/app/reports
    ports:
      - "127.0.0.1:3000:3000"
      # Si activas el receptor de syslog de Fortinet (Admin -> Configuracion
      # -> Fortinet), el FortiGate necesita llegar a este puerto UDP desde
      # afuera del VPS -- a diferencia de arriba, NO se puede dejar en
      # 127.0.0.1. OJO: Docker maneja sus propias reglas de iptables y por
      # default IGNORA ufw para los puertos que publica; descomentar la
      # linea de abajo expone ese puerto a internet aunque "ufw status"
      # diga que esta bloqueado. Antes de activarlo, restringi el origen
      # (por IP del FortiGate o VPN) o revisa la guia de ufw-docker en
      # deploy/DEPLOY.md, seccion de Fortinet.
      # - "0.0.0.0:5514:5514/udp"

  frontend:
    build:
      context: ./fronted
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: enterprise-soc-frontend
    restart: unless-stopped
    logging: *logging
    init: true
    environment:
      # Next standalone escucha en $HOSTNAME, que Docker pisa con el id del
      # contenedor: se fija para que responda tambien por 127.0.0.1.
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 60s
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  postgres_data:
  agent_downloads:
  report_files:
